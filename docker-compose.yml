services:
  db:
    image: postgres:16-alpine
    container_name: parallax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parallax
      POSTGRES_PASSWORD: parallax_secret_password
      POSTGRES_DB: parallax_eval
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax -d parallax_eval"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parallax_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://parallax:parallax_secret_password@db:5432/parallax_eval
      - ENVIRONMENT=production
      - USE_MOCK_LLM=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

